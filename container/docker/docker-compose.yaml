services:
  codex:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - ENABLE_XRDP=${ENABLE_XRDP:-true}
    stdin_open: true
    tty: true
    shm_size: '2gb'
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    volumes:
      - ../../files:/${FILES_MOUNT:-files}
      - ../persistent-codex-settings:/home/user/.codex
      # Hot, machine-only dirs on native ext4 (not the slow Windows 9p bind mount).
      # The bundled plugin marketplace under .tmp is ~39MB of tiny files that Codex
      # walks on every startup/sub-agent spawn; over 9p that alone added ~80s/prompt.
      # Sessions are intentionally left on the host bind mount above for portable,
      # outside-Docker persistence (append-only, so the 9p cost is negligible).
      - codex-tmp:/home/user/.codex/.tmp
      - codex-cache:/home/user/.codex/cache
    working_dir: /${FILES_MOUNT:-files}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-4430}:4430"
      - "${RDP_PORT:-33890}:3389"
      # Uncomment to enable SSH access (set a strong USER_PASSWORD first!)
      # - "${SSH_PORT:-2222}:22"
      # - "60000-60010:60000-60010/udp"
    environment:
      - USER_PASSWORD=${USER_PASSWORD:-changeme}
      - TZ=${TZ:-America/Los_Angeles}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_OAUTH_TOKEN=${OPENAI_OAUTH_TOKEN:-}
      - RDP_HOST_PORT=${RDP_PORT:-33890}
      - HTTP_HOST_PORT=${HTTP_PORT:-8080}
      - FILES_MOUNT=${FILES_MOUNT:-files}
    env_file: ../../Settings.txt
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"

volumes:
  codex-tmp:
  codex-cache:
